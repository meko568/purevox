name: build

# Builds PureVox for Windows, macOS (Intel + Apple Silicon), and Linux.
# You can't cross-compile a .app/.dmg from Linux or a real .msi from
# non-Windows reliably — Tauri needs to build on each real OS. GitHub
# Actions gives you all three for free via this matrix, no need to own
# a Mac or a Windows machine yourself.
#
# Trigger: push a tag like "v0.1.0" (see the on.push.tags line below),
# or run it manually from the Actions tab (workflow_dispatch).
#
# This project has no package.json / npm frontend build step (plain
# HTML/CSS/JS), so this workflow skips Node entirely and just uses Rust
# + the Tauri CLI directly.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin" # Apple Silicon (M1 and later)
          - platform: "macos-latest"
            target: "x86_64-apple-darwin" # Intel Macs
          - platform: "ubuntu-22.04"
            target: ""
          - platform: "windows-latest"
            target: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build
        working-directory: ./desktop/src-tauri
        run: cargo tauri build ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: purevox-${{ matrix.platform }}-${{ matrix.target || 'default' }}
          path: |
            desktop/src-tauri/target/**/release/bundle/**
          if-no-files-found: error

  release:
    needs: build
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect installer files
        run: |
          mkdir -p release-files
          find artifacts -type f \( \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.rpm' -o \
            -name '*.dmg' -o \
            -name '*.msi' -o \
            -name '*.exe' \
          \) -exec cp {} release-files/ \;
          cd release-files
          for f in *; do
            mv "$f" "$(printf %s "$f" | sed -E 's/[_-][0-9]+\.[0-9]+\.[0-9]+//g; s/-[0-9]+\.[[:alnum:].]*(x86_64|amd64|arm64)\./_\1./')"
          done
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Write release notes
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cat > body.md <<'EOF'
          # PureVox __VERSION__

          Remove background music from any video while keeping every word of dialogue — AI source separation runs **100% locally**. No uploads, no accounts, no watermarks.

          🌐 [Website](https://meko568.github.io/purevox/) · 📖 [Docs](https://meko568.github.io/purevox/docs.html) · 📝 [Guide](https://meko568.github.io/purevox/guides/remove-background-music.html) · ☁️ [Run in Colab](https://colab.research.google.com/github/meko568/purevox/blob/main/colab/purevox_colab.ipynb)

          ---

          ## 📥 Downloads

          | Platform | Download | Notes |
          |----------|----------|-------|
          | **Windows** 10/11 (64-bit) | `.exe` | Recommended installer |
          | **Windows** 10/11 (64-bit) | `.msi` | For admins / silent installs |
          | **macOS** Apple Silicon | `.dmg` *(aarch64)* | M1 / M2 / M3 / M4 Macs |
          | **macOS** Intel | `.dmg` *(x64)* | Intel Macs |
          | **Linux** (any distro) | `.AppImage` | Run directly, nothing to install |
          | **Linux** Debian / Ubuntu | `.deb` | `sudo apt install ./purevox_*_amd64.deb` |
          | **Linux** Fedora / RHEL | `.rpm` | `sudo dnf install ./purevox-*.rpm` |

          > 💡 First time? Grab the `.exe` on Windows, the *aarch64* `.dmg` on an Apple Silicon Mac, or the `.AppImage` on Linux.
          >
          > ☁️ Can't install anything? [Run PureVox in Google Colab](https://colab.research.google.com/github/meko568/purevox/blob/main/colab/purevox_colab.ipynb) — free, works even from a phone.

          ## ✅ Verify your download

          Every asset ships with a SHA-256 checksum in [SHA256SUMS.txt](https://github.com/__REPO__/releases/download/__VERSION__/SHA256SUMS.txt).

          **Linux**
          ```bash
          sha256sum -c SHA256SUMS.txt
          ```

          **macOS**
          ```bash
          shasum -a 256 <downloaded-file>
          ```

          **Windows (PowerShell)**
          ```powershell
          Get-FileHash <downloaded-file> -Algorithm SHA256
          ```

          Compare the output against the matching line in `SHA256SUMS.txt`.

          ## 🔧 Requirements

          - **OS:** Windows 10+, macOS 12+, or a modern Linux desktop
          - **RAM:** 8 GB minimum (16 GB recommended)
          - Models download automatically on first run (~100–300 MB depending on hardware)
          ---
          EOF
          sed -i -e "s/__VERSION__/${VERSION}/g" -e "s|__REPO__|${REPO}|g" body.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: PureVox ${{ github.ref_name }}
          body_path: body.md
          append_body: true
          files: release-files/*
          draft: false
          fail_on_unmatched_files: false
          generate_release_notes: true
